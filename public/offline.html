<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Sem conexão · Igreja em Charqueadas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #0a0a0a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 22rem; }
    img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 24px; }
    p.eyebrow { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: #00a7ff; margin: 0 0 12px; }
    h1 { font-size: 1.5rem; margin: 0 0 12px; font-weight: 800; }
    p { color: rgba(255,255,255,.55); line-height: 1.6; margin: 0; }
    button {
      margin-top: 28px;
      background: #00a7ff;
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { opacity: .85; }
  </style>
</head>
<body>
  <main>
    <img src="/android-chrome-192x192.png" alt="">
    <p class="eyebrow">Sem conexão</p>
    <h1>Você está offline</h1>
    <p>Não foi possível carregar a página. Verifique a internet e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
